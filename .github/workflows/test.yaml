name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          activate-environment: "true"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -r requirements_test.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=custom_components/swissweather --cov-report=term-missing tests

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Pyflakes rules only for now (undefined names, unused imports): they
      # catch real defects, e.g. the NameError a merge introduced in 60421bd.
      # Style rules follow once the existing code is brought in line.
      - name: Run ruff
        run: |
          uvx ruff@0.17.1 check --select F custom_components tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          activate-environment: "true"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -r requirements_test.txt mypy==2.4.0

      # Strict mode (pyproject.toml), as the Quality Scale's strict-typing rule asks.
      - name: Run mypy
        run: |
          mypy
