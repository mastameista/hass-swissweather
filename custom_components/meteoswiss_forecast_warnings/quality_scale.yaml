rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      Local brand images in brand/ (served by Home Assistant 2026.10 for
      custom integrations); the current MeteoSwiss app icon.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only follow their coordinator and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: There is no options flow; settings change through reconfigure.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: MeteoSwiss data needs no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud service; there is nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: A cloud service; there is nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: A cloud service without physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Devices follow the configured places, not a changing device list.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: >-
      Static icons are in icons.json. The primary/secondary/tertiary warning
      sensors still set their icon in code: dashboards read it from the icon
      state attribute, which icons.json does not provide.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
